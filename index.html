<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Keresőoptimalizálás (SEO) Meta Tag-ek -->
    <title>GTA VI Konzol Infók - Felbontás és FPS adatok (PS5, Xbox)</title>
    <meta name="description" content="Minden fontos részlet a GTA VI konzolos verzióiról. PS5, PS5 Pro, Xbox Series X és Series S felbontás, célzott FPS és grafikai technológiák egy helyen.">
    <meta name="keywords" content="GTA VI, GTA 6, PS5, PS5 Pro, Xbox Series X, Xbox Series S, felbontás, FPS, grafika, optimalizáció">
    <meta name="robots" content="index, follow">
    
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f051d 0%, #290b4e 50%, #090214 100%);
            min-height: 100vh;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        /* Pálmafa sziluettek a háttérben */
        body::before {
            content: "";
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 800 600" opacity="0.15"><path d="M80 600 C 90 450, 130 350, 200 300 C 150 260, 100 280, 50 320 C 40 250, 80 200, 160 220 C 130 150, 180 100, 240 160 C 260 210, 240 260, 210 290 C 280 320, 320 400, 330 600 Z" fill="%23ec4899"/><path d="M720 600 C 710 420, 650 320, 570 280 C 620 240, 680 260, 730 310 C 740 230, 690 180, 610 200 C 640 130, 580 80, 520 150 C 500 200, 520 250, 550 280 C 470 310, 430 400, 420 600 Z" fill="%238b5cf6"/></svg>');
            background-position: bottom center;
            background-size: cover;
            pointer-events: none;
            z-index: 0;
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.7), 0 0 20px rgba(236, 72, 153, 0.4);
        }

        .neon-border {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.25), inset 0 0 15px rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(236, 72, 153, 0.4);
        }

        .console-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .console-btn.active {
            background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            border-color: transparent;
            transform: scale(1.05);
        }

        .progress-bar {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center relative z-10">

    <div class="w-full max-w-3xl bg-black/60 backdrop-blur-xl rounded-3xl p-6 md:p-8 neon-border relative z-20">
        
        <!-- Címsor -->
        <h1 class="text-4xl md:text-5xl font-extrabold text-center mb-6 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-indigo-500 neon-glow uppercase">
            GTA VI Konzol Infók
        </h1>

        <!-- Konzol Választó Gombok -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
            <button onclick="selectConsole('ps5')" id="btn-ps5" class="console-btn py-3 px-4 bg-purple-950/40 rounded-xl border border-purple-500/30 font-semibold tracking-wide text-center hover:bg-purple-900/40 active:scale-95">
                PS5
            </button>
            <button onclick="selectConsole('ps5pro')" id="btn-ps5pro" class="console-btn py-3 px-4 bg-purple-950/40 rounded-xl border border-purple-500/30 font-semibold tracking-wide text-center hover:bg-purple-900/40 active:scale-95">
                PS5 Pro
            </button>
            <button onclick="selectConsole('xboxx')" id="btn-xboxx" class="console-btn py-3 px-4 bg-purple-950/40 rounded-xl border border-purple-500/30 font-semibold tracking-wide text-center hover:bg-purple-900/40 active:scale-95">
                Xbox X
            </button>
            <button onclick="selectConsole('xboxs')" id="btn-xboxs" class="console-btn py-3 px-4 bg-purple-950/40 rounded-xl border border-purple-500/30 font-semibold tracking-wide text-center hover:bg-purple-900/40 active:scale-95">
                Xbox S
            </button>
        </div>

        <!-- Fő Információs Panel -->
        <div class="bg-purple-950/20 rounded-2xl p-6 border border-purple-500/10 mb-6">
            <div class="divide-y divide-purple-500/10">
                <div class="flex justify-between py-4">
                    <span class="text-purple-300 font-medium md:text-lg">Felbontás:</span>
                    <span id="stat-resolution" class="font-bold text-right text-purple-100 md:text-lg">-</span>
                </div>
                <div class="flex justify-between py-4">
                    <span class="text-purple-300 font-medium md:text-lg">Célzott FPS:</span>
                    <span id="stat-fps" class="font-bold text-right text-yellow-400 md:text-lg">-</span>
                </div>
                <div class="flex justify-between py-4">
                    <span class="text-purple-300 font-medium md:text-lg">Grafikai szint:</span>
                    <span id="stat-graphics" class="font-bold text-right text-purple-100 md:text-lg">-</span>
                </div>
                <div class="flex justify-between py-4">
                    <span class="text-purple-300 font-medium md:text-lg">Technológia:</span>
                    <span id="stat-tech" class="font-bold text-right text-cyan-400 md:text-lg">-</span>
                </div>
            </div>
        </div>

        <!-- Alsó Grafikai Erő Csík -->
        <div class="bg-black/30 rounded-xl p-4 border border-purple-500/10">
            <div class="flex justify-between text-xs font-semibold tracking-wider uppercase text-purple-300 mb-2">
                <span>Becsült optimalizáltság és grafikai erő:</span>
                <span id="power-percentage" class="text-pink-400">0%</span>
            </div>
            <div class="w-full bg-purple-950/60 rounded-full h-3 overflow-hidden p-[2px] border border-purple-900/50">
                <div id="power-bar" class="progress-bar h-full bg-gradient-to-r from-purple-500 via-pink-500 to-rose-400 rounded-full w-0"></div>
            </div>
        </div>

    </div>

    <!-- Értesítési doboz -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gradient-to-r from-purple-900 to-indigo-950 border border-purple-500/40 px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <span class="text-2xl">⚡</span>
        <p id="toast-text" class="text-sm font-semibold tracking-wide text-purple-100"></p>
    </div>

    <script>
        const consoleData = {
            ps5: {
                resolution: "Dinamikus 4K (FSR-rel felskálázva)",
                fps: "30 FPS / Stabilizált",
                graphics: "Magas / Sugárkövetés (Ray Tracing)",
                tech: "AMD FSR 3.0",
                power: 75,
                msg: "PlayStation 5 mód betöltve!"
            },
            ps5pro: {
                resolution: "Valódi 4K / PSSR felskálázás",
                fps: "60 FPS (Teljesítmény) vagy 30 FPS",
                graphics: "Ultra / Fejlett Ray Tracing",
                tech: "Sony PSSR (AI alapú)",
                power: 95,
                msg: "PlayStation 5 Pro mód aktív!"
            },
            xboxx: {
                resolution: "Dinamikus 4K (Native bázis magasabb)",
                fps: "30 FPS / Stabilizált",
                graphics: "Magas / Sugárkövetés (Ray Tracing)",
                tech: "AMD FSR 3.0 Hardware",
                power: 78,
                msg: "Xbox Series X adatok betöltve!"
            },
            xboxs: {
                resolution: "Dinamikus 1080p - 1440p",
                fps: "30 FPS",
                graphics: "Közepes / Optimalizált",
                tech: "Szoftveres FSR / S-SRE",
                power: 45,
                msg: "Xbox Series S profil betöltve."
            }
        };

        function selectConsole(consoleId) {
            document.querySelectorAll('.console-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(`btn-${consoleId}`).classList.add('active');

            const data = consoleData[consoleId];

            updateStat('stat-resolution', data.resolution);
            updateStat('stat-fps', data.fps);
            updateStat('stat-graphics', data.graphics);
            updateStat('stat-tech', data.tech);

            document.getElementById('power-percentage').innerText = `${data.power}%`;
            document.getElementById('power-bar').style.width = `${data.power}%`;

            showToast(data.msg);
        }

        function updateStat(elementId, newValue) {
            const el = document.getElementById(elementId);
            el.style.opacity = 0;
            setTimeout(() => {
                el.innerText = newValue;
                el.style.opacity = 1;
                el.style.transition = 'opacity 0.2s ease-in-out';
            }, 150);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
